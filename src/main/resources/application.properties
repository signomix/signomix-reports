signomix.image.group.default=
quarkus.container-image.builder=jib
quarkus.container-image.group=${SIGNOMIX_IMAGE_GROUP:${signomix.image.group.default}}
quarkus.container-image.name=${SIGNOMIX_IMAGE_NAME:signomix-reports}
quarkus.container-image.tag=${SIGNOMIX_IMAGE_TAG:%release%}

signomix.organization.default=${SIGNOMIX_ORGANIZATION_DEFAULT:0}

# Instruct SmallRye to read properties from files in /run/secrets
smallrye.config.source.file.locations=/run/secrets

## Redis
signomix.redis.host=${SIGNOMIX_REDIS_HOST:redis}
signomix.redis.port=${SIGNOMIX_REDIS_PORT:6379}

## Report config
signomix.report.limit=${SIGNOMIX_QUERY_LIMIT:500}

## HTTP
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.access-log.enabled=true

## DATASOURCES
signomix.database.type=${SIGNOMIX_DATABASE_TYPE:postgresql}

## Agroal Connection Pool Configuration
## Default values are too low for production workloads
## Recommended: max-size should be based on your PostgreSQL max_connections and expected load

# OLAP DataSource (read-heavy, analytical queries)
quarkus.datasource.olap.db-kind=postgresql
quarkus.datasource.olap.username=${postgres_user}
quarkus.datasource.olap.password=${postgres_password}
quarkus.datasource.olap.jdbc.url=${postgres_url}
quarkus.datasource.olap.jdbc.min-size=${OLAP_POOL_MIN_SIZE:5}
quarkus.datasource.olap.jdbc.max-size=${OLAP_POOL_MAX_SIZE:20}
quarkus.datasource.olap.jdbc.initial-size=${OLAP_POOL_INITIAL_SIZE:5}
quarkus.datasource.olap.jdbc.acquisition-timeout=${OLAP_POOL_ACQUISITION_TIMEOUT:10S}
quarkus.datasource.olap.jdbc.validation-timeout=${OLAP_POOL_VALIDATION_TIMEOUT:2S}
quarkus.datasource.olap.jdbc.leak-detection-timeout=${OLAP_POOL_LEAK_DETECTION_TIMEOUT:30S}
quarkus.datasource.olap.jdbc.reap-timeout=${OLAP_POOL_REAP_TIMEOUT:30S}
quarkus.datasource.olap.jdbc.telemetry=true

# OLTP DataSource (transactional, frequent queries)
quarkus.datasource.oltp.db-kind=postgresql
quarkus.datasource.oltp.username=${postgres_user}
quarkus.datasource.oltp.password=${postgres_password}
quarkus.datasource.oltp.jdbc.url=${postgres_url}
quarkus.datasource.oltp.jdbc.min-size=${OLTP_POOL_MIN_SIZE:5}
quarkus.datasource.oltp.jdbc.max-size=${OLTP_POOL_MAX_SIZE:20}
quarkus.datasource.oltp.jdbc.initial-size=${OLTP_POOL_INITIAL_SIZE:5}
quarkus.datasource.oltp.jdbc.acquisition-timeout=${OLTP_POOL_ACQUISITION_TIMEOUT:10S}
quarkus.datasource.oltp.jdbc.validation-timeout=${OLTP_POOL_VALIDATION_TIMEOUT:2S}
quarkus.datasource.oltp.jdbc.leak-detection-timeout=${OLTP_POOL_LEAK_DETECTION_TIMEOUT:30S}
quarkus.datasource.oltp.jdbc.reap-timeout=${OLTP_POOL_REAP_TIMEOUT:30S}
quarkus.datasource.oltp.jdbc.telemetry=true

# QDB DataSource (QuestDB, logs)
quarkus.datasource.qdb.db-kind=postgresql
quarkus.datasource.qdb.username=${questdb_user}
quarkus.datasource.qdb.password=${questdb_password}
quarkus.datasource.qdb.jdbc.url=${questdb_url}
quarkus.datasource.qdb.jdbc.min-size=${QDB_POOL_MIN_SIZE:2}
quarkus.datasource.qdb.jdbc.max-size=${QDB_POOL_MAX_SIZE:10}
quarkus.datasource.qdb.jdbc.initial-size=${QDB_POOL_INITIAL_SIZE:2}
quarkus.datasource.qdb.jdbc.acquisition-timeout=${QDB_POOL_ACQUISITION_TIMEOUT:5S}
quarkus.datasource.qdb.jdbc.validation-timeout=${QDB_POOL_VALIDATION_TIMEOUT:2S}
quarkus.datasource.qdb.jdbc.leak-detection-timeout=${QDB_POOL_LEAK_DETECTION_TIMEOUT:30S}
quarkus.datasource.qdb.jdbc.reap-timeout=${QDB_POOL_REAP_TIMEOUT:30S}
quarkus.datasource.qdb.jdbc.telemetry=true
questdb.client.config=${questdb_config}

## OPENAPI
quarkus.smallrye-openapi.path=/api/reports
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/reports/q/swagger

## OPEN TELEMTRY
quarkus.otel.service.name=${SIGNOMIX_REPORTS_OTEL_NAME:signomix-reports}
quarkus.otel.exporter.otlp.endpoint=${otel_service_url}
quarkus.otel.exporter.otlp.headers=${otel_service_headers}
quarkus.otel.exporter.otlp.timeout=3s
quarkus.otel.exporter.otlp.logs.timeout=3s
quarkus.otel.logs.enabled=true
quarkus.otel.logs.level=INFO
# quarkus.otel.service.name=signomix-otel-proxy
